<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="Pretendard, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="1280" height="560" fill="#1a1a19"/>

  <text x="64" y="72" fill="#ffffff" font-size="30" font-family="'Iowan Old Style', Palatino, Georgia, serif">The consultant pipeline</text>
  <text x="64" y="104" fill="#898781" font-size="16">Six stages. What this demo covered is marked; what it did not is left visibly uncovered.</text>

  <!-- connector spine -->
  <line x1="112" y1="248" x2="1216" y2="248" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Stage 1 — Scoping : not covered -->
  <rect x="64" y="176" width="164" height="144" rx="12" fill="none" stroke="rgba(255,255,255,0.10)" stroke-dasharray="4 4"/>
  <text x="84" y="212" fill="#6a6862" font-size="12" letter-spacing="1.4">01</text>
  <text x="84" y="242" fill="#898781" font-size="19">Scoping</text>
  <text x="84" y="272" fill="#6a6862" font-size="13">Study area,</text>
  <text x="84" y="292" fill="#6a6862" font-size="13">criteria</text>

  <!-- Stage 2 — Data : surface shown -->
  <rect x="252" y="176" width="164" height="144" rx="12" fill="none" stroke="rgba(255,255,255,0.10)"/>
  <text x="272" y="212" fill="#6a6862" font-size="12" letter-spacing="1.4">02</text>
  <text x="272" y="242" fill="#ffffff" font-size="19">Data</text>
  <text x="272" y="272" fill="#898781" font-size="13">Intake surfaces;</text>
  <text x="272" y="292" fill="#898781" font-size="13">adapters offline</text>

  <!-- Stage 3 — Build : live -->
  <rect x="440" y="176" width="164" height="144" rx="12" fill="rgba(76,141,255,0.16)" stroke="#4c8dff"/>
  <text x="460" y="212" fill="#4c8dff" font-size="12" letter-spacing="1.4">03</text>
  <text x="460" y="242" fill="#ffffff" font-size="19">Build</text>
  <text x="460" y="272" fill="#c3c2b7" font-size="13">Map to a loading</text>
  <text x="460" y="292" fill="#c3c2b7" font-size="13">Vissim network</text>

  <!-- Stage 4 — Calibrate : surface shown -->
  <rect x="676" y="176" width="164" height="144" rx="12" fill="none" stroke="rgba(255,255,255,0.10)"/>
  <text x="696" y="212" fill="#6a6862" font-size="12" letter-spacing="1.4">04</text>
  <text x="696" y="242" fill="#ffffff" font-size="19">Calibrate</text>
  <text x="696" y="272" fill="#898781" font-size="13">GEH scoring and</text>
  <text x="696" y="292" fill="#898781" font-size="13">refusal logic</text>

  <!-- Stage 5 — Analyze : live -->
  <rect x="864" y="176" width="164" height="144" rx="12" fill="rgba(76,141,255,0.16)" stroke="#4c8dff"/>
  <text x="884" y="212" fill="#4c8dff" font-size="12" letter-spacing="1.4">05</text>
  <text x="884" y="242" fill="#ffffff" font-size="19">Analyze</text>
  <text x="884" y="272" fill="#c3c2b7" font-size="13">Curated charts,</text>
  <text x="884" y="292" fill="#c3c2b7" font-size="13">absences named</text>

  <!-- Stage 6 — Report : live -->
  <rect x="1052" y="176" width="164" height="144" rx="12" fill="rgba(76,141,255,0.16)" stroke="#4c8dff"/>
  <text x="1072" y="212" fill="#4c8dff" font-size="12" letter-spacing="1.4">06</text>
  <text x="1072" y="242" fill="#ffffff" font-size="19">Report</text>
  <text x="1072" y="272" fill="#c3c2b7" font-size="13">Firm format from</text>
  <text x="1072" y="292" fill="#c3c2b7" font-size="13">one sample file</text>

  <!-- The gate, sitting between Build and Calibrate -->
  <line x1="640" y1="248" x2="676" y2="248" stroke="rgba(255,255,255,0.07)"/>
  <rect x="440" y="368" width="400" height="92" rx="12" fill="rgba(224,133,119,0.10)" stroke="rgba(224,133,119,0.35)"/>
  <text x="460" y="400" fill="#e49787" font-size="15">Validation gate — V1 to V9</text>
  <text x="460" y="426" fill="#c3c2b7" font-size="13">78 finding codes. Nothing is published while it refuses,</text>
  <text x="460" y="446" fill="#c3c2b7" font-size="13">including networks this system generated itself.</text>
  <line x1="640" y1="320" x2="640" y2="368" stroke="rgba(224,133,119,0.35)" stroke-dasharray="3 3"/>

  <!-- legend -->
  <rect x="64" y="486" width="20" height="12" rx="3" fill="rgba(76,141,255,0.16)" stroke="#4c8dff"/>
  <text x="94" y="497" fill="#898781" font-size="13">demonstrated live</text>
  <rect x="248" y="486" width="20" height="12" rx="3" fill="none" stroke="rgba(255,255,255,0.10)"/>
  <text x="278" y="497" fill="#898781" font-size="13">surface shown, result not yet claimed</text>
  <rect x="576" y="486" width="20" height="12" rx="3" fill="none" stroke="rgba(255,255,255,0.10)" stroke-dasharray="4 4"/>
  <text x="606" y="497" fill="#898781" font-size="13">not covered in this demo</text>
</svg>
