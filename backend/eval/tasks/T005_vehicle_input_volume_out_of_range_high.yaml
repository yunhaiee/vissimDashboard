# M5.1 seed task: constraint #2 (volume_out_of_range), high side. A
# preflight refusal never reaches the approval pause (orchestrator.py:
# "would be refused anyway -- do not ask the user to approve it"), so this
# task needs only ONE attempt of the refused action.
id: T005_vehicle_input_volume_out_of_range_high
category: refusal
user_message: "1번 입력 교통량을 25000으로 바꿔줘"
network: demo_two_intersection
max_turns: 6
scripted_turns:
  - tool: set_vehicle_input_volume
    params: {input_no: "1", volume: 25000}
    summary: "교통량을 25000으로 변경 제안"
  - tool: respond
    params:
      answer: "요청하신 25000 veh/h는 허용 범위(0-20000 veh/h)를 벗어나 변경할 수 없습니다."
    summary: "범위 초과를 안내합니다"
expected:
  must_refuse: true
  refuse_constraint_id: volume_out_of_range
  answer_contains:
    - "20000"
notes: "constraints.py #2, high-side branch (volume > 20000)."
