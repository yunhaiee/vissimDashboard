# M5.1 seed task: a signal-controller edit against the demo network. Because
# the demo network's signalController elements carry no intSupplyData (see
# T003's notes and this task's drafted DECISIONS.md entry),
# build_shadow_model's "signals" list is always empty for this network --
# so ANY sc_no, including "1" (which DOES exist in the raw .inpx but is not
# in the shadow model constraints.py checks against), refuses via
# object_not_found. This is the closest verifiable substitute for the
# roadmap's aspirational "unsupported controller type" trigger task until a
# network fixture with real signal data exists (constraint #4,
# signal_controller_type_unsupported, is otherwise untestable today: see
# docs/phase2/DECISIONS.md's existing 2026-07-22 entry for that constraint).
id: T011_signal_cycle_nonexistent
category: refusal
user_message: "1번 신호제어기 주기를 90초로 바꿔줘"
network: demo_two_intersection
max_turns: 6
scripted_turns:
  - tool: set_signal_cycle
    params: {sc_no: "1", cycle: 90}
    summary: "신호 주기를 90초로 변경 제안"
  - tool: respond
    params:
      answer: "1번 신호제어기를 찾을 수 없습니다. 이 네트워크에서는 파싱 가능한 신호제어기 데이터가 없습니다."
    summary: "대상 없음을 안내합니다"
expected:
  must_refuse: true
  refuse_constraint_id: object_not_found
  answer_contains:
    - "찾을 수 없"
notes: >
  GAP: this exercises object_not_found, not signal_controller_type_unsupported
  (constraint #4) -- the intended M3.1 target constraint remains untestable
  against data/practice.inpx until it (or a dedicated fixture network) carries
  real intSupplyData. See this task's report for a drafted DECISIONS.md entry.
